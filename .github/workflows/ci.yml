name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend (lint, compile, smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend + mock deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r mocks/requirements.txt
          pip install asgi-lifespan httpx pytest
      - name: Byte-compile all Python
        run: python -m compileall backend mocks scripts tests ingest
      - name: Integration smoke test (in-process Qdrant + mock TEI/vLLM)
        run: python tests/ci_smoke.py
      - name: Hallucination / grounding eval
        run: python tests/eval_hallucination.py

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
