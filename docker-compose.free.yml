# $0 FAST STACK — local private embeddings + free-tier Gemini for generation.
#
#   1. Install Ollama (https://ollama.com) and pull the embedding model:
#        ollama pull bge-m3          # embeddings run LOCALLY (private)
#   2. Get a FREE Gemini API key: https://aistudio.google.com/apikey
#   3. Create a file named  .env  in this folder containing:
#        GEMINI_API_KEY=your_free_key_here
#   4. docker compose -f docker-compose.free.yml up --build
#   5. Open http://localhost:3000
#
# Embeddings stay on your machine (Ollama / bge-m3). Only the question + the
# retrieved excerpt are sent to Gemini for fast, high-quality wording.
#
# Prefer fully local generation (nothing leaves the machine, slower)? override:
#   set VLLM_BASE_URL=http://host.docker.internal:11434/v1
#   set VLLM_MODEL_NAME=llama3.2
#   (and `ollama pull llama3.2` first)
# Prefer Groq instead of Gemini? set VLLM_BASE_URL / VLLM_MODEL_NAME / GEMINI_API_KEY
# to the Groq values (see docs/FREE_LOCAL.md).

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: clinical_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  init:
    build:
      context: ./backend
    container_name: clinical_init
    command: ["python", "bootstrap.py"]
    environment:
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=clinical_sops
      - EMBED_BACKEND=openai
      - EMBED_MODEL=bge-m3
      - TEI_EMBEDDING_URL=http://host.docker.internal:11434
      - EMBEDDING_DIM=1024
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant
    restart: "no"

  backend:
    build:
      context: ./backend
    container_name: clinical_backend
    environment:
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=clinical_sops
      # Embeddings: LOCAL + private via Ollama (bge-m3)
      - EMBED_BACKEND=openai
      - EMBED_MODEL=bge-m3
      - TEI_EMBEDDING_URL=http://host.docker.internal:11434
      # Generation: free-tier Gemini by default (fast). Override to go local.
      - VLLM_BASE_URL=${VLLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      - VLLM_MODEL_NAME=${VLLM_MODEL_NAME:-gemini-2.0-flash}
      - VLLM_API_KEY=${GEMINI_API_KEY:-}
      - CONF_MIN=0.45
      - CONF_HIGH=0.6
      - MAX_TOKENS=400
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1/query
    container_name: clinical_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  qdrant_data:
