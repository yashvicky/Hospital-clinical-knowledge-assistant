# $0 LOCAL STACK — real models, no GPU, no Hugging Face downloads in Docker.
# Embeddings AND generation both run through your local Ollama, so the only
# containers are Qdrant + backend + UI.
#
#   1. Install Ollama (https://ollama.com) and pull the two models:
#        ollama pull bge-m3        # embeddings (~1.2 GB, 1024-dim)
#        ollama pull llama3.2      # generation (~2 GB; use llama3.2:1b if small)
#   2. Make sure the Ollama app is running (serves OpenAI-compatible API on 11434)
#   3. docker compose -f docker-compose.free.yml up --build
#   4. Open http://localhost:3000
#
# Nothing leaves your machine. First model calls are slow while Ollama loads
# them into memory; the backend retries during seeding.

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: clinical_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # One-shot: create the collection + seed sample SOPs (embeds via Ollama).
  init:
    build:
      context: ./backend
    container_name: clinical_init
    command: ["python", "bootstrap.py"]
    environment:
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=clinical_sops
      - EMBED_BACKEND=openai
      - EMBED_MODEL=bge-m3
      - TEI_EMBEDDING_URL=http://host.docker.internal:11434
      - EMBEDDING_DIM=1024
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant
    restart: "no"

  backend:
    build:
      context: ./backend
    container_name: clinical_backend
    environment:
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=clinical_sops
      # Embeddings via Ollama (OpenAI-compatible /v1/embeddings)
      - EMBED_BACKEND=openai
      - EMBED_MODEL=bge-m3
      - TEI_EMBEDDING_URL=http://host.docker.internal:11434
      # Generation via Ollama (OpenAI-compatible /v1/chat/completions)
      - VLLM_BASE_URL=http://host.docker.internal:11434/v1
      - VLLM_MODEL_NAME=llama3.2
      - VLLM_API_KEY=ollama
      # BGE-M3 cosine scores run lower than the blueprint's defaults;
      # calibrate the confidence gate for it (override as you like).
      - CONF_MIN=0.45
      - CONF_HIGH=0.6
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach host Ollama (esp. on Linux)
    depends_on:
      - qdrant

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1/query
    container_name: clinical_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  qdrant_data:
